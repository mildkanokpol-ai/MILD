name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android project
        run: node materialize.cjs
      - name: Verify source
        working-directory: android
        run: |
          node tools/check.cjs
          node tests/android-isolation.cjs
      - name: Build test APK
        working-directory: android
        env:
          API_DEPLOYMENT_ID: ${{ vars.API_DEPLOYMENT_ID }}
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug -PapiDeploymentId="$API_DEPLOYMENT_ID"
      - name: Signing fingerprint
        working-directory: android
        run: |
          gradle --no-daemon :app:signingReport > signing-fingerprint.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-finance-android-test
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/signing-fingerprint.txt
            android/SHA256SUMS.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: android/app/build/reports/
